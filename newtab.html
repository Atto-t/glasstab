<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>New Tab</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <nav class="top-bar">
    <div id="edit-toolbar" class="edit-toolbar hidden">
      <div class="dropdown-wrap">
        <button id="add-widget-btn" class="top-btn glass">＋ WIDGET</button>
        <div id="widget-menu" class="dropdown-menu glass-panel hidden">
          <div class="menu-title">ADD TO CANVAS</div>
          <button data-type="scratchpad">Scratchpad</button>
          <button data-type="telemetry">System Telemetry</button>
          <button data-type="transfers">Session Transfers</button>
          <button data-type="checklist">Checklist</button>
          <button data-type="monitor">Ping Monitor</button>
        </div>
      </div>
      <button id="open-engine-modal" class="top-btn glass" title="Customize Search Engines">⚙ ENGINES</button>
      <button id="open-system-modal" class="top-btn glass" title="Backup & Reset">⇄ DATA</button>
    </div>

    <div class="apps-hover-wrap">
      <button id="quick-apps-btn" class="top-icon-btn glass" title="Google Apps">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="currentColor">
          <path d="M6 8c1.1 0 2-.9 2-2s-.9-2-2-2-2 .9-2 2 .9 2 2 2zm6 12c1.1 0 2-.9 2-2s-.9-2-2-2-2 .9-2 2 .9 2 2 2zm-6 0c1.1 0 2-.9 2-2s-.9-2-2-2-2 .9-2 2 .9 2 2 2zm0-6c1.1 0 2-.9 2-2s-.9-2-2-2-2 .9-2 2 .9 2 2 2zm6 0c1.1 0 2-.9 2-2s-.9-2-2-2-2 .9-2 2 .9 2 2 2zm6-6c0 1.1.9 2 2 2s2-.9 2-2-.9-2-2-2-2 .9-2 2zm-6 0c1.1 0 2-.9 2-2s-.9-2-2-2-2 .9-2 2 .9 2 2 2zm6 6c1.1 0 2-.9 2-2s-.9-2-2-2-2 .9-2 2 .9 2 2 2zm0 6c1.1 0 2-.9 2-2s-.9-2-2-2-2 .9-2 2 .9 2 2 2z"/>
        </svg>
      </button>
      <div id="quick-apps-popover" class="apps-popover glass-panel"></div>
    </div>

    <button id="edit-mode-btn" class="top-btn edit-toggle-btn glass" title="Toggle Edit Mode">⚙ EDIT</button>
  </nav>

  <div id="widget-canvas" class="widget-canvas"></div>

  <main class="center-core">
    <header class="hud-header">
      <div id="clock" class="clock">00:00</div>
      <div id="date" class="date">INITIALIZING...</div>
    </header>

    <form id="search-form" class="search-box glass">
      <div class="custom-select-wrap" id="engine-dropdown-wrap">
        <button type="button" id="engine-trigger" class="engine-trigger">
          <span id="engine-current-name">Google</span>
          <span class="chevron">▾</span>
        </button>
        <div id="engine-options" class="custom-options glass-panel hidden"></div>
      </div>

      <input type="text" id="search-input" placeholder="Search or type a URL..." autocomplete="off" autofocus>

      <button type="button" id="voice-btn" class="icon-btn voice-btn" title="Voice Search">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="currentColor">
          <path d="M12 14c1.66 0 3-1.34 3-3V5c0-1.66-1.34-3-3-3S9 3.34 9 5v6c0 1.66 1.34 3 3 3zm5.91-3c-.49 0-.9.36-.98.85C16.52 14.2 14.47 16 12 16s-4.52-1.8-4.93-4.15c-.08-.49-.49-.85-.98-.85-.61 0-1.09.54-1 1.14.49 3 2.89 5.35 5.91 5.78V20c0 .55.45 1 1 1s1-.45 1-1v-2.08c3.02-.43 5.42-2.78 5.91-5.78.1-.6-.39-1.14-1-1.14z"/>
        </svg>
      </button>
      <button type="submit" class="icon-btn search-submit" title="Search">⌕</button>
    </form>

    <section class="dock-section">
      <div id="main-grid" class="shortcut-grid"></div>
    </section>
  </main>

  <div id="shortcut-modal" class="modal hidden">
    <div class="modal-content glass-panel">
      <h3 id="modal-title">ADD SHORTCUT</h3>

      <label class="input-label">TITLE</label>
      <input type="text" id="site-title" maxlength="24" placeholder="e.g. GitHub">

      <label class="input-label">URL</label>
      <input type="url" id="site-url" placeholder="e.g. https://github.com/">

      <label class="input-label">CUSTOM ICON URL (OPTIONAL)</label>
      <input type="url" id="site-icon" placeholder="https://.../icon.png">

      <div class="modal-actions">
        <button id="cancel-btn" class="btn-secondary">CANCEL</button>
        <button id="save-btn" class="btn-primary">SAVE</button>
      </div>
    </div>
  </div>

  <div id="engine-modal" class="modal hidden">
    <div class="modal-content glass-panel">
      <h3>SEARCH ENGINES</h3>
      <div id="engine-list" class="engine-list"></div>
      <div class="engine-add-box">
        <input type="text" id="eng-name" maxlength="18" placeholder="Name (e.g. Brave)">
        <input type="url" id="eng-url" placeholder="Query URL (e.g. https://search.brave.com/search?q=)">
        <button id="add-eng-btn" class="btn-primary">＋ ADD ENGINE</button>
      </div>
      <div class="modal-actions">
        <button id="close-eng-btn" class="btn-secondary">CLOSE</button>
      </div>
    </div>
  </div>

  <div id="system-modal" class="modal hidden">
    <div class="modal-content glass-panel">
      <h3>WORKSPACE BACKUP</h3>
      <p class="modal-desc">Export your layout, widgets, and shortcuts to JSON, or reset to default.</p>
      <div class="system-actions">
        <button id="export-btn" class="btn-primary">⬇ EXPORT WORKSPACE JSON</button>
        <label class="btn-primary file-label">
          ⬆ IMPORT WORKSPACE JSON
          <input type="file" id="import-input" accept=".json" class="hidden">
        </label>
        <button id="reset-btn" class="btn-danger">↺ RESET ALL TO DEFAULT</button>
      </div>
      <div class="modal-actions">
        <button id="close-sys-btn" class="btn-secondary">CLOSE</button>
      </div>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
